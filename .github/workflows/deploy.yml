name: CI/CD Pipeline - AI Pods Engine Core

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-security-gate:
    name: 🛡️ Quality & Security Gate
    runs-on: ubuntu-latest
    # Postgres for the store integration tests (SPEC-CORE-67)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aipods
          POSTGRES_PASSWORD: aipods
          POSTGRES_DB: aipods_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aipods -d aipods_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://aipods:aipods@localhost:5432/aipods_test?sslmode=disable
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run go vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...

  docker-build-and-push:
    name: 🐋 Build Multi-Stage Docker Image
    needs: quality-and-security-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ghcr.io/onlyone-ai-pods/aipods-core-engine:latest
