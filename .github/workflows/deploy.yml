name: CI/CD Pipeline - AI Pods Engine Core

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-security-gate:
    name: 🛡️ Quality & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run go vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...

  docker-build-and-push:
    name: 🐋 Build Multi-Stage Docker Image
    needs: quality-and-security-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ghcr.io/onlyone-ai-pods/aipods-core-engine:latest
